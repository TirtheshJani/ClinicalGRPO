# GRPO hyperparameters and reward weights (hardware-agnostic).
# Override hardware-specific values via --hw configs/hardware/<gpu>.yaml.

model_config: configs/model.yaml

dataset:
  train_path: data/processed/mimic.parquet
  val_path: data/processed/mimic_val.parquet
  prompt_column: prompt
  gold_column: gold_codes

grpo:
  num_generations: 8          # group size for GRPO
  beta: 0.04                  # KL coefficient
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_steps: 1000
  save_steps: 100
  logging_steps: 5
  max_prompt_length: 1536
  max_completion_length: 512
  temperature: 0.9
  top_p: 1.0

sft:
  max_steps: 500
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  save_steps: 100
  logging_steps: 5

rewards:
  exact_weight: 1.0
  chapter_weight: 0.3
  hallucination_penalty: 0.1
  format_invalid_penalty: 0.5

output_dir: outputs/grpo
seed: 42
report_to: []                 # add "wandb" to log to Weights & Biases
