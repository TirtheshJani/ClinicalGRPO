[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-grpo"
version = "0.1.0"
description = "GRPO post-training of Qwen3-4B-Instruct for ICD-10 coding from clinical discharge summaries."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ClinicalGRPO contributors" }]
dependencies = [
    "unsloth>=2025.3",
    "trl>=0.15,<0.18",
    "transformers>=4.49,<4.52",
    "peft>=0.14",
    "accelerate>=1.3",
    "bitsandbytes>=0.45",
    "datasets",
    "pydantic-settings",
    "pyyaml",
    "tyro",
    "groq",
    "pandas",
    "pyarrow",
    "jsonschema",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
app = ["gradio>=5", "spaces"]

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_grpo"]

[tool.hatch.build.targets.sdist]
include = ["src/", "configs/", "scripts/", "app/", "tests/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "gpu: requires a CUDA device (Unsloth + TRL GRPOTrainer smoke)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
